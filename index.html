function MacroBar({ value, max, color }) {
  const pct = Math.min((value / max) * 100, 100);
  return (
    <div style={{ background: "rgba(255,255,255,0.08)", borderRadius: 6, height: 6, width: "100%", overflow: "hidden" }}>
      <div style={{ width: `${pct}%`, height: "100%", background: color, borderRadius: 6, transition: "width 0.4s ease" }} />
    </div>
  );
}

function MealPlan() {
  const [activeDay, setActiveDay] = useState(0);
  const [expandedMeal, setExpandedMeal] = useState(null);
  const [showRecipe, setShowRecipe] = useState({});

  const currentDay = days[activeDay];
  const totalKcal = currentDay.meals.reduce((s, m) => s + m.kcal, 0);
  const totalProtein = currentDay.meals.reduce((s, m) => s + m.protein, 0);
  const totalCarbs = currentDay.meals.reduce((s, m) => s + m.carbs, 0);
  const totalFats = currentDay.meals.reduce((s, m) => s + m.fats, 0);
  const totalFibre = currentDay.meals.reduce((s, m) => s + m.fibre, 0);

  const toggleRecipe = (i, e) => {
    e.stopPropagation();
    setShowRecipe(prev => ({ ...prev, [i]: !prev[i] }));

  return (

        <div style={{ fontSize: 26, fontWeight: "bold", letterSpacing: 1 }}>🇮🇳 Muscle Gain Meal Plan</div>
        <div style={{ fontSize: 12, opacity: 0.85, marginTop: 6 }}>180cm · 59kg · Gym @ 10 AM · ~3,000 kcal/day</div>
      </div>

      <div style={{ display: "flex", overflowX: "auto", gap: 8, padding: "16px 16px 0" }}>
        {days.map((d, i) => (
          <button key={i} onClick={() => { setActiveDay(i); setExpandedMeal(null); setShowRecipe({}); }} style={{
            flex: "0 0 auto", padding: "10px 18px", borderRadius: 50, border: "none", cursor: "pointer",
            fontFamily: "inherit", fontSize: 13, fontWeight: activeDay === i ? "bold" : "normal",
            background: activeDay === i ? "linear-gradient(135deg, #FF6B35, #E91E63)" : "rgba(255,255,255,0.08)",
            color: "#fff", transition: "all 0.2s", whiteSpace: "nowrap",
            boxShadow: activeDay === i ? "0 4px 16px rgba(255,107,53,0.4)" : "none"
          }}>{d.label}</button>
        ))}
      </div>

      <div style={{ margin: "16px 16px 0", background: "rgba(255,255,255,0.06)", borderRadius: 18, padding: "18px 20px", border: "1px solid rgba(255,255,255,0.1)" }}>
        <div style={{ fontSize: 11, letterSpacing: 2, textTransform: "uppercase", opacity: 0.5, marginBottom: 14 }}>Daily Totals</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr 1fr", gap: 10 }}>

            { label: "Kcal", value: totalKcal, unit: "", color: "#FF6B35", max: 3500 },
            { label: "Protein", value: totalProtein, unit: "g", color: "#4CAF50", max: 160 },
            { label: "Carbs", value: totalCarbs, unit: "g", color: "#2196F3", max: 400 },
            { label: "Fats", value: totalFats, unit: "g", color: "#FFC107", max: 100 },
            { label: "Fibre", value: totalFibre, unit: "g", color: "#00BCD4", max: 40 },
          ].map((m, i) => (
            <div key={i} style={{ textAlign: "center" }}>

              <div style={{ fontSize: 9, opacity: 0.4, marginBottom: 6 }}>{m.label}</div>

            {expandedMeal === i && (
              <div style={{ marginTop: 14, paddingTop: 12, borderTop: "1px solid rgba(255,255,255,0.08)" }}>
                <div style={{ fontSize: 10, opacity: 0.4, letterSpacing: 2, textTransform: "uppercase", marginBottom: 8 }}>Ingredients</div>
                <div style={{ marginBottom: 14 }}>
                  {meal.meals.map((item, j) => (
                    <div key={j} style={{ display: "flex", alignItems: "center", gap: 10, padding: "6px 0", borderBottom: j < meal.meals.length - 1 ? "1px solid rgba(255,255,255,0.05)" : "none" }}>
                      <div style={{ width: 6, height: 6, borderRadius: "50%", background: meal.color, flexShrink: 0 }} />
                      <div style={{ fontSize: 13, opacity: 0.9 }}>{item}</div>
                    </div>
                  ))}
                </div>

                <button onClick={(e) => toggleRecipe(i, e)} style={{
                  display: "flex", alignItems: "center", gap: 8, width: "100%",
                  background: `${meal.color}18`, border: `1px solid ${meal.color}55`,
                  borderRadius: 10, padding: "9px 12px", cursor: "pointer",
                  fontFamily: "inherit", color: "#fff", fontSize: 12, fontWeight: "bold",
                  marginBottom: showRecipe[i] ? 10 : 14
                }}>
                  <span>👨‍🍳</span>
                  <span style={{ color: meal.color }}>{showRecipe[i] ? "Hide Recipe" : "How to Make It"}</span>
                  <span style={{ marginLeft: "auto", opacity: 0.5, fontSize: 10 }}>{showRecipe[i] ? "▲" : "▼"}</span>
                </button>

                {showRecipe[i] && (
                  <div style={{ background: "rgba(0,0,0,0.25)", borderRadius: 12, padding: "12px 14px", marginBottom: 14, border: `1px solid ${meal.color}33` }}>
                    {meal.steps.map((step, si) => (
                      <div key={si} style={{ display: "flex", gap: 10, padding: "6px 0", alignItems: "flex-start" }}>
                        <div style={{ width: 20, height: 20, borderRadius: "50%", background: meal.color, color: "#000", fontSize: 10, fontWeight: "bold", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, marginTop: 1 }}>{si + 1}</div>
                        <div style={{ fontSize: 12.5, opacity: 0.85, lineHeight: 1.5 }}>{step}</div>
                      </div>
                    ))}
                  </div>
                )}

                <div style={{ background: "rgba(0,0,0,0.2)", borderRadius: 12, padding: "12px 14px" }}>
                  <div style={{ fontSize: 10, opacity: 0.4, letterSpacing: 2, textTransform: "uppercase", marginBottom: 10 }}>Macro Breakdown</div>
                  {[
                    { label: "Protein", value: meal.protein, unit: "g", color: "#4CAF50", max: 55 },
                    { label: "Carbs", value: meal.carbs, unit: "g", color: "#2196F3", max: 100 },
                    { label: "Fats", value: meal.fats, unit: "g", color: "#FFC107", max: 30 },
                    { label: "Fibre", value: meal.fibre, unit: "g", color: "#00BCD4", max: 15 },
                  ].map((macro, mi) => (
                    <div key={mi} style={{ marginBottom: mi < 3 ? 10 : 0 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                        <span style={{ fontSize: 11, color: macro.color }}>{macro.label}</span>
                        <span style={{ fontSize: 11, opacity: 0.6 }}>{macro.value}{macro.unit}</span>
                      </div>
                      <MacroBar value={macro.value} max={macro.max} color={macro.color} />
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        ))}
      </div>

      <div style={{ margin: "12px 16px 0", background: "rgba(255,255,255,0.04)", border: "1px dashed rgba(255,255,255,0.1)", borderRadius: 12, padding: "12px 16px", display: "flex", alignItems: "center", gap: 10, fontSize: 12, opacity: 0.6 }}>
        <span>🏋️</span><span>Gym @ <strong>10:00 AM</strong> — Pre-workout at 7:30 AM · Post-workout shake at 11:30 AM</span>
      </div>

      <div style={{ margin: "14px 16px 0", background: "rgba(33,150,243,0.07)", border: "1px solid rgba(33,150,243,0.18)", borderRadius: 16, padding: "16px" }}>
        <div style={{ fontSize: 11, letterSpacing: 2, textTransform: "uppercase", color: "#2196F3", marginBottom: 12 }}>📊 Your Daily Targets</div>
        {[
          { label: "🔥 Calories", target: "~3,000 kcal", note: "Lean bulk surplus" },
          { label: "🟢 Protein", target: "120–135g", note: "2g per kg bodyweight" },
          { label: "🔵 Carbs", target: "300–360g", note: "Primary energy source" },
          { label: "🟡 Fats", target: "70–90g", note: "Hormones & recovery" },
          { label: "🩵 Fibre", target: "25–35g", note: "Digestion & gut health" },
        ].map((t, i) => (
          <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: i < 4 ? "1px solid rgba(255,255,255,0.05)" : "none" }}>
            <span style={{ fontSize: 13 }}>{t.label}</span>
            <div style={{ textAlign: "right" }}>
              <div style={{ fontSize: 13, fontWeight: "bold" }}>{t.target}</div>
              <div style={{ fontSize: 10, opacity: 0.4 }}>{t.note}</div>
            </div>
          </div>
        ))}
      </div>

      <div style={{ margin: "14px 16px 0", background: "rgba(255,107,53,0.07)", border: "1px solid rgba(255,107,53,0.18)", borderRadius: 16, padding: "16px" }}>
        <div style={{ fontSize: 11, letterSpacing: 2, textTransform: "uppercase", color: "#FF6B35", marginBottom: 10 }}>💡 Tips</div>
        {[
          "Drink 3–4L water daily — especially important for fibre absorption",
          "Dal, rajma, chana & veggies are your best fibre sources",
          "Don't skip the before-bed snack — casein feeds muscles overnight",
          "Sunday = rest day, reduce calories to ~2,600 kcal"
        ].map((tip, i) => (
          <div key={i} style={{ fontSize: 12, opacity: 0.75, padding: "5px 0", display: "flex", gap: 8 }}>
            <span style={{ color: "#FF6B35" }}>→</span> {tip}
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<MealPlan />);
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
